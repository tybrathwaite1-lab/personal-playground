name: Publish visual results

# Publishes validated screenshots from a completed "Visual check" run to the `visual-results`
# branch, so the owner, ChatGPT and Claude can all review visual work through git.
#
# Security model (see collaboration/security/visual-publishing.md):
#  - `workflow_run` workflows always run the DEFAULT BRANCH's definition, so branch code can
#    never change this job until it has been reviewed and merged.
#  - The job checks out exactly the workflow's own commit (github.workflow_sha) with plain git
#    and runs a zero-dependency Node script from it (scripts/visual/publish/publish.mjs). No
#    third-party actions, no npm install, and no code from the triggering branch, its artifact
#    or the results branch is ever executed or checked out.
#  - The artifact is untrusted review material (branch code produced it): eligibility,
#    freshness, provenance, file types, paths, sizes, counts, symlinks, traversal, archive
#    structure, CRCs and content are validated before anything is written. The existing
#    results branch is re-validated too, and the publish fails closed on anything unexpected.
#  - Least privilege: the job can read Actions data and write repository contents. The token
#    is used for authenticated API reads and the final push, and lives in one step's env.

on:
  workflow_run:
    workflows: [Visual check]
    types: [completed]

permissions: {}

concurrency:
  group: visual-results-publish
  cancel-in-progress: false

jobs:
  publish:
    # Successful push runs from this repository only (never forks or pull_request runs).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # read the triggering run and download its artifact
      contents: write # push to visual-results
    env:
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # The default-branch commit this workflow definition came from (github.sha, the default
      # branch tip at trigger time, is the documented equivalent for workflow_run).
      TRUSTED_SHA: ${{ github.workflow_sha || github.sha }}
    steps:
      - name: Check out the workflow's own commit (trusted code only)
        run: |
          git init --quiet trusted
          git -C trusted fetch --quiet --depth=1 --no-tags "https://github.com/$REPO.git" "$TRUSTED_SHA"
          git -C trusted -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          git -C trusted log -1 --format='Trusted code: %H %s'

      - name: Validate and publish
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }} # this step only
        run: |
          node --version
          node scripts/visual/publish/publish.mjs
