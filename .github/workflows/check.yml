name: Check (branches)

# Runs tests, a live Local Pulse ingest and a production build on non-main
# branches, without deploying. Lets changes be verified before merging.
on:
  push:
    branches-ignore: [main, image-scout, image-scout-results, visual-results]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Install-script restrictions (negative test with this npm)
        run: node scripts/security/install-scripts-probe.mjs
      - name: Production dependency audit (report only)
        run: node scripts/security/audit-report.mjs
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - run: npm test
      - name: Validate Weekly Drop editions (strict)
        run: npm run content
      - name: Check source links (report only)
        run: npm run links
        continue-on-error: true
      - name: Cache editorial images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/images/editorial
          key: images-${{ hashFiles('src/data/images.ts', 'scripts/images/fetch.ts') }}
          restore-keys: images-

      - name: Fetch and optimize editorial images
        run: npx tsx scripts/images/fetch.ts
        continue-on-error: true

      - name: Weekly Drop candidate leads (unreviewed, never auto-published)
        run: npx tsx scripts/drop/candidates.ts
        continue-on-error: true

      - name: Local Pulse ingest (live feeds)
        run: npx tsx scripts/pulse/ingest.ts --out public/data/pulse.json --report
      - name: Production smoke check (informational — checks the live site, not this branch)
        run: npx tsx scripts/smoke/prod.ts "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
