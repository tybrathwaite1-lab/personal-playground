name: Image scout (maintainer tool)

# Push to the image-scout branch to search Wikimedia Commons for candidate photos.
# Results (contact sheets + metadata) are committed to the image-scout-results branch.
#
# Two jobs, separated by an artifact boundary:
#  - generate (read-only token): installs dependencies, runs the scout and the optional
#    snapshots. Third-party npm code and external downloads only ever run here.
#  - publish (contents: write): no checkout, no npm, no repository code. It downloads the
#    generate job's artifact, checks it is plain result files within fixed limits, and
#    force-pushes one parentless commit to image-scout-results. The token reaches git
#    only through an environment-scoped header, never a URL or command argument.
on:
  push:
    branches: [image-scout]

permissions:
  contents: read

concurrency:
  group: image-scout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund

      - name: Scout Wikimedia Commons (required)
        run: npx tsx scripts/images/scout.ts

      # The two snapshots are conveniences for local testing. If one fails, the run shows a
      # warning on that step and the results are published without it.
      - name: Snapshot live Pulse data for local testing (optional)
        continue-on-error: true
        run: |
          npx tsx scripts/pulse/ingest.ts --out scout/pulse.json
          npx tsx scripts/drop/candidates.ts
          cp public/data/candidates.json scout/

      - name: Snapshot editorial images for local previews (optional)
        continue-on-error: true
        run: |
          npx tsx scripts/images/fetch.ts
          mkdir -p scout/editorial
          cp public/images/editorial/*-600.webp scout/editorial/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scout-results
          path: scout
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to image-scout-results
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scout-results
          path: scout

      - name: Check the results are plain files within limits
        run: |
          set -euo pipefail
          cd scout
          if [ -n "$(find . -mindepth 1 ! -type f ! -type d -print -quit)" ]; then
            echo "::error::results contain something other than regular files and directories"; exit 1
          fi
          bad=$(find . -type f | awk '!/^\.\/(editorial\/)?[A-Za-z0-9._-]+\.(jpg|webp|json)$/')
          if [ -n "$bad" ]; then
            echo "::error::unexpected result paths:"; echo "$bad"; exit 1
          fi
          test -f results.json || { echo "::error::results.json is missing"; exit 1; }
          count=$(find . -type f | wc -l)
          bytes=$(find . -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "Results: $count files, $bytes bytes"
          [ "$count" -le 500 ] || { echo "::error::too many files ($count)"; exit 1; }
          [ "$bytes" -le 52428800 ] || { echo "::error::results too large ($bytes bytes)"; exit 1; }

      - name: Publish results to image-scout-results
        working-directory: scout
        env:
          GH_TOKEN: ${{ github.token }} # this step only; reaches git via an env-scoped header
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q -b image-scout-results
          git config user.name "image-scout"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Scout results ${SOURCE_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -f --quiet "https://github.com/$REPO.git" HEAD:refs/heads/image-scout-results
          echo "Published $(git rev-parse --short HEAD) to image-scout-results"
