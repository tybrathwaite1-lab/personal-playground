name: Image scout (maintainer tool)

# Push to the image-scout branch to search Wikimedia Commons for candidate photos.
# Results (contact sheets + metadata) are committed to the image-scout-results branch.
#
# Two jobs, separated by an artifact boundary:
#  - generate (read-only token): installs dependencies, runs the scout and the optional
#    snapshots. Third-party npm code and external downloads only ever run here.
#  - publish (contents: write): no checkout, no npm, no repository code. It downloads the
#    generate job's artifact outside the workspace, validates every entry (fail closed), copies
#    only the allowed files into a new empty directory, and force-pushes one parentless commit
#    of that directory to image-scout-results. The token reaches git
#    only through an environment-scoped header, never a URL or command argument.
on:
  push:
    branches: [image-scout]

permissions:
  contents: read

concurrency:
  group: image-scout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund

      - name: Scout Wikimedia Commons (required)
        run: npx tsx scripts/images/scout.ts

      # The two snapshots are conveniences for local testing. If one fails, the run shows a
      # warning on that step and the results are published without it.
      - name: Snapshot live Pulse data for local testing (optional)
        continue-on-error: true
        run: |
          npx tsx scripts/pulse/ingest.ts --out scout/pulse.json
          npx tsx scripts/drop/candidates.ts
          cp public/data/candidates.json scout/

      - name: Snapshot editorial images for local previews (optional)
        continue-on-error: true
        run: |
          npx tsx scripts/images/fetch.ts
          mkdir -p scout/editorial
          cp public/images/editorial/*-600.webp scout/editorial/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scout-results
          path: scout
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to image-scout-results
    steps:
      # The artifact was produced by a job that ran third-party code, so its contents are
      # untrusted. It is extracted outside the workspace and never used as a git directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scout-results
          path: ${{ runner.temp }}/scout-artifact

      # Validate every entry first (fail closed), then copy only the allowed files, as fresh
      # 0644 regular files, into a new empty publishing directory.
      - name: Validate results and stage a clean publishing directory
        env:
          SRC: ${{ runner.temp }}/scout-artifact
          OUT: ${{ runner.temp }}/scout-publish
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          name_ok='^\./(editorial/)?[A-Za-z0-9][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+)*\.(jpg|webp|json)$'
          [ -d "$SRC" ] && [ ! -L "$SRC" ] || fail "artifact directory missing"
          cd "$SRC"
          files=()
          bytes=0
          while IFS= read -r -d '' p; do
            if [ -L "$p" ]; then fail "symlink in results: ${p@Q}"
            elif [ -d "$p" ]; then [ "$p" = ./editorial ] || fail "unexpected directory: ${p@Q}"
            elif [ -f "$p" ]; then
              [[ "$p" =~ $name_ok ]] || fail "unexpected file name: ${p@Q}"
              magic=$(head -c 12 -- "$p" | od -An -tx1 | tr -d ' \n')
              case "$p" in
                *.jpg) [[ "$magic" == ffd8ff* ]] || fail "not a JPEG: ${p@Q}" ;;
                *.webp) [[ "$magic" == 52494646????????57454250 ]] || fail "not a WebP: ${p@Q}" ;;
                *.json) node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' -- "$p" 2>/dev/null || fail "invalid JSON: ${p@Q}" ;;
              esac
              files+=("$p")
              bytes=$(( bytes + $(stat -c %s -- "$p") ))
            else fail "special file in results: ${p@Q}"
            fi
          done < <(find . -mindepth 1 -print0)
          [ -f ./results.json ] || fail "results.json is missing"
          [ "${#files[@]}" -le 500 ] || fail "too many files (${#files[@]})"
          [ "$bytes" -le 52428800 ] || fail "results too large ($bytes bytes)"
          rm -rf -- "$OUT"
          mkdir -m 0755 -- "$OUT"
          for p in "${files[@]}"; do install -D -m 0644 -- "$p" "$OUT/${p#./}"; done
          echo "Staged ${#files[@]} files ($bytes bytes) in a clean publishing directory"

      - name: Publish results to image-scout-results
        working-directory: ${{ runner.temp }}/scout-publish
        env:
          GH_TOKEN: ${{ github.token }} # this step only; reaches git via an env-scoped header
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ ! -e .git ] || { echo "::error::publishing directory already has .git"; exit 1; }
          # Ignore system and global git config, and never run hooks.
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init -q -b image-scout-results
          git config core.hooksPath /dev/null
          git config user.name "image-scout"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Scout results ${SOURCE_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -f --quiet "https://github.com/$REPO.git" HEAD:refs/heads/image-scout-results
          echo "Published $(git rev-parse --short HEAD) to image-scout-results"
