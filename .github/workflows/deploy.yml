name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily refresh of the Local Pulse (and the Friday Weekly Drop goes live on its own by date).
    # GitHub cron is UTC: 10:17 UTC ≈ 5:17am New York (EST) / 6:17am (EDT).
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed yet, so use `npm install`.
      # Once you commit package-lock.json, switch this to `npm ci` for reproducible builds.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
        continue-on-error: true # style issues shouldn't block a deploy; check the log

      - name: Tests
        run: npm test

      - name: Cache editorial images
        uses: actions/cache@v4
        with:
          path: public/images/editorial
          key: images-${{ hashFiles('src/data/images.ts') }}
          restore-keys: images-

      - name: Fetch and optimize editorial images
        run: npx tsx scripts/images/fetch.ts
        continue-on-error: true

      - name: Weekly Drop candidate leads (unreviewed, never auto-published)
        run: npx tsx scripts/drop/candidates.ts
        continue-on-error: true

      - name: Refresh Local Pulse (public event calendars)
        run: npx tsx scripts/pulse/ingest.ts --out public/data/pulse.json
        env:
          # Carry over yesterday's events for any feed that fails today.
          PULSE_PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/pulse.json

      - name: Type-check and build
        run: npm run build
        env:
          # Project sites are served from /<repo-name>/. Change to "/" for a custom domain or <user>.github.io repo.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
