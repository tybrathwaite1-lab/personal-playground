name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed yet, so use `npm install`.
      # Once you commit package-lock.json, switch this to `npm ci` for reproducible builds.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
        continue-on-error: true # style issues shouldn't block a deploy; check the log

      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build
        env:
          # Project sites are served from /<repo-name>/. Change to "/" for a custom domain or <user>.github.io repo.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
