name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily refresh of the Local Pulse (and the Friday Weekly Drop goes live on its own by date).
    # GitHub cron is UTC: 10:17 UTC ≈ 5:17am New York (EST) / 6:17am (EDT).
    - cron: '17 10 * * *'

# Least privilege: the workflow default is read-only. Only the deploy job, which runs no
# repository or third-party npm code, may write to Pages and mint an OIDC token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages site configuration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reproducible install from the committed package-lock.json (PP-011).
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (blocking; warnings fail too)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Cache editorial images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/images/editorial
          key: images-${{ hashFiles('src/data/images.ts', 'scripts/images/fetch.ts') }}
          restore-keys: images-

      - name: Fetch and optimize editorial images
        run: npx tsx scripts/images/fetch.ts
        continue-on-error: true

      - name: Weekly Drop candidate leads (unreviewed, never auto-published)
        run: npx tsx scripts/drop/candidates.ts
        continue-on-error: true

      - name: Refresh Local Pulse (public event calendars)
        run: npx tsx scripts/pulse/ingest.ts --out public/data/pulse.json
        env:
          # Carry over yesterday's events for any feed that fails today.
          PULSE_PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/pulse.json

      - name: Type-check and build
        run: npm run build
        env:
          # Project sites are served from /<repo-name>/. Change to "/" for a custom domain or <user>.github.io repo.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Stamp build (lets the smoke check confirm which commit is live)
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: printf '{"commit":"%s","builtAt":"%s"}\n' "$COMMIT_SHA" "$(date -u +%FT%TZ)" > dist/version.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # deploy the uploaded Pages artifact
      id-token: write # OIDC token required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Read-only check of the live site: app shell, bundles, service worker, deployed
  # commit and a fresh, consistent pulse.json. Public URLs only, no credentials.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    # Normally ~15 s; requests are bounded in prod.ts, this bounds everything else.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Production smoke check
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: npx tsx scripts/smoke/prod.ts "$PAGE_URL" --expect-commit "$COMMIT_SHA"
